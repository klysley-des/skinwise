global
    maxconn 200

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend skinwise
    bind *:80
    default_backend webs

backend webs
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    http-response set-header X-Served-By %[srv_name]
    server web01 web01:3000 check
    server web02 web02:3000 check
